<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marées · Arcachon</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --creme:#F3EDE3; --sable:#E6DCC8; --carte:#E9E2D3; --sauge:#A9AE8C; --eau:#8FB6C6; --bleu:#B7CFDB; --marine:#1B1F5C; --vert:#3F6F68; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--creme); }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; color: var(--marine); }
  .barre { margin-bottom: 18px; }
  .fermer { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px 0 14px; border: 2px solid var(--marine); border-radius: 22px; color: var(--marine); text-decoration: none; font-size: 15px; font-weight: 700; }
  .fermer:focus-visible { outline: 3px solid var(--vert); outline-offset: 2px; }
  .app { max-width: 430px; min-height: 100dvh; margin: 0 auto; padding: 20px 24px 0; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  header { display: flex; justify-content: space-between; align-items: flex-end; }
  .lieu { font-family: 'Caveat', cursive; font-size: 38px; line-height: 1; color: var(--vert); }
  h1 { margin: 0; font-size: 46px; line-height: 1.1; font-weight: 700; }
  .fleches { display: flex; gap: 8px; }
  .rond { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--marine); background: transparent; color: var(--marine); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .rond:disabled { opacity: .35; cursor: default; }
  button:focus-visible { outline: 3px solid var(--vert); outline-offset: 2px; }
  .semaine { display: flex; justify-content: space-between; margin: 26px 0 8px; }
  .jour { width: 44px; height: 64px; border-radius: 22px; border: 0; background: transparent; color: var(--marine); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; padding: 0; }
  .jour b { display: block; font-size: 18px; font-weight: 700; }
  .jour[aria-pressed="true"] { background: var(--marine); color: var(--creme); }
  h2 { font-size: 20px; margin: 18px 0 14px; font-weight: 700; }
  .carte { background: var(--carte); border-radius: 28px; padding: 20px 12px 18px; }
  .colonnes { display: flex; justify-content: space-around; align-items: flex-end; height: 250px; border-bottom: 3px solid var(--sauge); }
  .col { width: 64px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .col .h { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .col .barre { width: 48px; border-radius: 24px 24px 0 0; }
  .col .t { font-size: 15px; font-weight: 600; margin-top: 10px; }
  .legende { display: flex; gap: 22px; justify-content: center; margin-top: 44px; font-size: 14px; font-weight: 500; }
  .legende i { display: inline-block; width: 12px; height: 12px; border-radius: 6px; margin-right: 6px; }
  #msg { margin: 14px 4px 0; font-size: 15px; min-height: 1.4em; }
  .pied { position: relative; margin: auto -24px 0; padding-top: 24px; }
  .pied svg { display: block; width: 100%; height: auto; }
  .source { position: absolute; left: 24px; bottom: 10px; font-size: 12px; font-weight: 700; }
  .cache { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<main class="app">
  <div class="barre"><a class="fermer" href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>Fermer</a></div>
  <header>
    <div><div class="lieu">Arcachon</div><h1>Marées</h1></div>
    <div class="fleches">
      <button class="rond" id="prec" aria-label="Jour précédent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="rond" id="suiv" aria-label="Jour suivant"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </header>
  <nav class="semaine" id="semaine" aria-label="Jours disponibles"></nav>
  <h2 id="titre" aria-live="polite">Chargement…</h2>
  <section class="carte">
    <div class="colonnes" id="colonnes"></div>
    <div class="legende"><span><i style="background:var(--eau)"></i>Pleine mer</span><span><i style="background:var(--sauge)"></i>Basse mer</span></div>
  </section>
  <p id="msg" role="status"></p>
  <footer class="pied">
    <svg viewBox="0 0 390 170" aria-hidden="true">
      <path d="M0 90Q50 70 100 90T200 90T300 90T390 90V170H0Z" fill="#B7CFDB"/>
      <g fill="#2E4A3B"><polygon transform="translate(-10 38) scale(1.1)" points="40,0 62,36 50,36 72,70 58,70 80,108 0,108 22,70 8,70 30,36 18,36"/><polygon transform="translate(300 28) scale(1.3)" points="40,0 62,36 50,36 72,70 58,70 80,108 0,108 22,70 8,70 30,36 18,36"/></g>
      <g fill="#3A5C49"><polygon transform="translate(60 62)" points="40,0 62,36 50,36 72,70 58,70 80,108 0,108 22,70 8,70 30,36 18,36"/><polygon transform="translate(230 52) scale(.9)" points="40,0 62,36 50,36 72,70 58,70 80,108 0,108 22,70 8,70 30,36 18,36"/></g>
      <path d="M0 142Q100 118 200 138T390 128V170H0Z" fill="#E6DCC8"/>
    </svg>
    <div class="source">Source : SHOM · heure légale</div>
  </footer>
</main>

<!-- Vignette officielle du SHOM : chargée masquée, ses données sont relues puis réaffichées ci-dessus. -->
<div class="cache" aria-hidden="true"><script src="https://services.data.shom.fr/hdm/vignette/grande/ARCACHON_EYRAC?locale=fr"></script></div>

<script>
(function () {
  var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var LETTRES = ['D','L','M','M','J','V','S'];
  var jours = [], courant = 0;

  function ligne(txt) { return txt.replace(/\s+/g, ' ').trim(); }

  // Lit le document de la vignette : titres de date + lignes PM/BM (heure, hauteur).
  function lire(doc) {
    var res = [], jour = null;
    var noeuds = doc.querySelectorAll('h1, h2, h3, tr');
    for (var i = 0; i < noeuds.length; i++) {
      var n = noeuds[i], txt = ligne(n.textContent);
      if (n.tagName === 'TR') txt = ligne([].map.call(n.querySelectorAll('th, td'), function (c) { return c.textContent; }).join(' '));
      var m;
      if (n.tagName !== 'TR' && (m = txt.match(/(\d{1,2})\s+([a-zéûè]+)\s+(\d{4})/i)) && MOIS.indexOf(m[2].toLowerCase()) > -1) {
        jour = { date: new Date(+m[3], MOIS.indexOf(m[2].toLowerCase()), +m[1], 12), marees: [] }; res.push(jour); continue;
      }
      if ((m = txt.match(/^(\d{2})\/(\d{2})\/(\d{4})$/)) ) {
        jour = { date: new Date(+m[3], +m[2] - 1, +m[1], 12), marees: [] }; res.push(jour); continue;
      }
      if (n.tagName === 'TR' && jour) {
        var type = txt.match(/\b(PM|BM)\b/), heure = txt.match(/(\d{1,2}):(\d{2})/), haut = txt.replace(heure ? heure[0] : '', '').match(/(\d+[.,]\d+)/);
        if (type && heure && haut) jour.marees.push({ type: type[1], h: ('0' + heure[1]).slice(-2) + 'h' + heure[2], m: parseFloat(haut[1].replace(',', '.')) });
      }
    }
    return res.filter(function (j) { return j.marees.length; });
  }

  function trouverVignette() {
    var f = document.querySelector('iframe[id^="vignette_shom_"]') || document.querySelector('.cache iframe');
    try { return f && f.contentDocument ? f.contentDocument : null; } catch (e) { return null; }
  }

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function fmt(m) { return m.toFixed(2).replace('.', ',') + ' m'; }

  function dessiner() {
    var j = jours[courant];
    document.getElementById('titre').textContent = j.date.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }).replace(/^./, function (c) { return c.toUpperCase(); });
    var cols = document.getElementById('colonnes'); cols.textContent = '';
    j.marees.forEach(function (t) {
      var c = el('div', 'col'), b = el('div', 'barre');
      b.style.height = Math.round(t.m * 50) + 'px';
      b.style.background = t.type === 'PM' ? 'var(--eau)' : 'var(--sauge)';
      c.appendChild(el('div', 'h', fmt(t.m))); c.appendChild(b); c.appendChild(el('div', 't', t.h));
      c.setAttribute('aria-label', (t.type === 'PM' ? 'Pleine mer' : 'Basse mer') + ' à ' + t.h + ', ' + fmt(t.m));
      cols.appendChild(c);
    });
    var boutons = document.querySelectorAll('#semaine .jour');
    for (var i = 0; i < boutons.length; i++) boutons[i].setAttribute('aria-pressed', i === courant ? 'true' : 'false');
    document.getElementById('prec').disabled = courant === 0;
    document.getElementById('suiv').disabled = courant === jours.length - 1;
  }

  function aller(i) { if (i >= 0 && i < jours.length) { courant = i; dessiner(); } }

  function demarrer(donnees) {
    jours = donnees;
    var nav = document.getElementById('semaine');
    jours.forEach(function (j, i) {
      var b = el('button', 'jour'); b.type = 'button';
      b.appendChild(document.createTextNode(LETTRES[j.date.getDay()]));
      b.appendChild(el('b', null, String(j.date.getDate())));
      b.setAttribute('aria-label', j.date.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }));
      b.addEventListener('click', function () { aller(i); });
      nav.appendChild(b);
    });
    document.getElementById('prec').addEventListener('click', function () { aller(courant - 1); });
    document.getElementById('suiv').addEventListener('click', function () { aller(courant + 1); });
    document.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') aller(courant - 1); if (e.key === 'ArrowRight') aller(courant + 1); });
    dessiner();
  }

  function echec() {
    document.getElementById('titre').textContent = 'Marées indisponibles';
    document.getElementById('msg').textContent = 'Les données du SHOM n’ont pas pu être lues. Recharge la page dans un instant.';
    document.getElementById('prec').disabled = true; document.getElementById('suiv').disabled = true;
  }

  var essais = 0;
  function sonder() {
    var doc = trouverVignette(), d = doc ? lire(doc) : [];
    if (d.length) return demarrer(d);
    if (++essais > 40) return echec();
    setTimeout(sonder, 250);
  }
  window.addEventListener('load', sonder);
})();
</script>
</body>
</html>
